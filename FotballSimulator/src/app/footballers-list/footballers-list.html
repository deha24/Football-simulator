<ul class="list-group mt-3">
    @if (footballers.length === 0) {
      <li class="d-flex justify-content-between">No players found.</li>
    } @else {
      @for (footballer of footballers; track footballer) {
        <footballers-list-item [footballer]="footballer"></footballers-list-item>
      }
    }
  </ul>
