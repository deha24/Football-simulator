<li class="d-flex justify-content-between list-group-item">

    <span class="me-4">{{ club.name }}</span>
  </div>
  <button class="btn btn-secondary" aria-label="search" (click)="$event.preventDefault(); detailsClub(club.id)">Edit</button>
  <club-remove [club]="club"><button></button></club-remove>
</li>
