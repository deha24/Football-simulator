<td>
  {{coach.first_name}}
</td>
<td>
  {{coach.last_name}}
</td>
<td>
  {{coach.birth_date}}
</td>
<td>
  {{coach.nationality}}
</td>
<td>
  {{coach.short_lineup}}
</td>
<td>
  {{coach.defence}}
</td>
<td>  
  {{coach.midfield}}
</td>
<td>
  {{coach.attack}}
</td>
<td>
    {{coach.midfield_style}}
</td>
<td>
    {{coach.balance_style}}
</td>
<td>
  <div class="row mt-1 gx-3 gy-2 align-items-top justify-content-left">
    <div class="col-sm-4">
      <button pButton type="button" (click)="openEditDialog(coach.id)" severity="secondary">
        <i class="pi pi-pencil"></i>
      </button>
      <p-dialog header="Edit Coach" [(visible)]="displayEditDialog" [modal]="true">
        @if (displayEditDialog) {
          <coach-update [coach]="coach"></coach-update>
        }
      </p-dialog>
    </div>
    <div class="col-sm-4">
      <button pButton type="button" (click)="detailsCoach(coach.id)" severity="secondary">
        <i class="pi pi-search"></i>
      </button>
    </div>
    <div class="col-sm-4">
      <coach-remove [coachId]="coach.id"></coach-remove>
    </div>
  </div>
</td>
