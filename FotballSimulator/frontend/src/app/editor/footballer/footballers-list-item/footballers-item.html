<td>
  <div class="row mt-1 gx-3 gy-2 align-items-top justify-content-left">
    <div class="col-sm-4">
      <button pButton type="button" (click)="openEditDialog()" severity="secondary">
        <i class="pi pi-pencil"></i>
      </button>
      <p-dialog header="Edytuj piłkarza" [(visible)]="displayEditDialog" [modal]="true">
        <footballer-edit [footballer]="footballer"></footballer-edit>
      </p-dialog>
    </div>
    <div class="col-sm-4">
      <button pButton type="button" (click)="detailsFootballer(footballer.id)" severity="secondary">
        <i class="pi pi-search"></i>
      </button>
    </div>
    <div class="col-sm-4">
      <footballer-remove [footballer]="footballer"></footballer-remove>
    </div>
  </div>
</td>
