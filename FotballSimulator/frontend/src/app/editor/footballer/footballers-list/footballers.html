<p-table #dt [value]="footballers" dataKey="id" dataKey="id" editMode="row" (sortFunction)="customSort($event)" [customSort]="true">

    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="first_name">
                <div class="flex items-center gap-2">
                    first name
                    <p-sortIcon field="first_name" />
                </div>
            </th>
            <th pSortableColumn="last_name">
                <div class="flex items-center gap-2">
                    Last name
                    <p-sortIcon field="last_name" />
                </div>
            </th>
            <th pSortableColumn="birth_date">
                <div class="flex items-center gap-2">
                    Birth Date
                    <p-sortIcon field="birth_date" />
                </div>
            </th>
            <th pSortableColumn="nationality">
                <div class="flex items-center gap-2">
                    Nationality
                    <p-sortIcon field="nationality" />
                </div>
            </th>
            <th pSortableColumn="position">
                <div class="flex items-center gap-2">
                    Position
                    <p-sortIcon field="position" />
                </div>
            </th>
            <th pSortableColumn="defence">
                <div class="flex items-center gap-2">
                    Defence
                    <p-sortIcon field="defence" />
                </div>
            </th>
            <th pSortableColumn="midfield">
                <div class="flex items-center gap-2">
                    Midfield
                    <p-sortIcon field="midfield" />
                </div>
            </th>
            <th pSortableColumn="attack">
                <div class="flex items-center gap-2">
                    Attack
                    <p-sortIcon field="attack" />
                </div>
            </th>
        </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-footballer let-editing="editing" let-ri="rowIndex">
        <tr footballers-item [footballer]="footballer" [pEditableRow]="footballer" [editing]="editing" [rowIndex]="ri"></tr>
    </ng-template>
</p-table>
