<form class="row mt-3 gx-3 gy-2 align-items-center justify-content-center" [formGroup]="addfootballerform" (ngSubmit)="$event.preventDefault(); addNewFootballer()">
  <div class="col-sm-3">
    <input type="text" name="new-footballer-text" class="form-control" formControlName="newFootballerFirstName" placeholder="Enter footballer first name" />
    @if (addfootballerform.get('newFootballerFirstName')?.invalid && addfootballerform.get('newFootballerFirstName')?.touched) {
      <small class="text-danger">First name is required.</small>
    }
  </div>
  <div class="col-sm-3">
    <input type="text" name="new-footballer-lastname" class="form-control" formControlName="newFootballerLastname" placeholder="Enter footballer last name" />
    @if (addfootballerform.get('newFootballerLastname')?.invalid && addfootballerform.get('newFootballerLastname')?.touched) {
      <small class="text-danger">Last name is required.</small>
    }
  </div>
  <div class="col-sm-3">
    <select class="form-select" aria-label="Default select example" formControlName="newFootballerLeague">
      <option value="" disabled selected>Select league</option>
      @for (league of leagues; track league) {
        <option [value]="league.id">{{ league.name }}</option>
      }
      @if (addfootballerform.get('newFootballerLeague')?.invalid && addfootballerform.get('newFootballerLeague')?.dirty) {
        <small class="text-danger">League selection is required.</small>
      }
    </select>
  </div>
  <div class="col-auto">
    <button
      type="submit"
      class="btn btn-primary"
    >Add Footballer</button>
  </div>
</form>
